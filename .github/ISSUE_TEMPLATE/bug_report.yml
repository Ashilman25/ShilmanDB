name: Bug report
description: Something gives a wrong answer, crashes, hangs or fails to build.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more exact the steps, the faster it gets fixed.
  - type: textarea
    id: what-you-ran
    attributes:
      label: What you ran
      description: The commands, in order, from a clean checkout if you can.
      placeholder: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHILMANDB_BUILD_BENCH=ON
        cmake --build build
        ./build/bench/load_tpch --sf 0.01 --db-file /tmp/tpch.db --data-dir bench/tpch_data/sf0.01/
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong answer, the reference answer (SQLite, DuckDB or Postgres) and where it came from.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, error message or wrong rows. Paste text, not screenshots.
      render: text
    validations:
      required: true
  - type: textarea
    id: query
    attributes:
      label: The load_tpch command or SQL
      description: The full `load_tpch` command line with its flags, or the SQL statement that fails.
      render: sql
  - type: input
    id: os
    attributes:
      label: OS and machine
      placeholder: macOS 26, Apple M-series
    validations:
      required: true
  - type: dropdown
    id: build-type
    attributes:
      label: Build type
      options:
        - Debug
        - Release
        - Release with ML (SHILMANDB_ENABLE_ML=ON)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Scale factor, pool size, eviction policy, execution mode, or anything you already ruled out.
